<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher sign-in · Classroom Cards</title><link rel="stylesheet" href="/static/app.css"><script defer src="/static/app.js"></script></head>
<body data-page="login"><header class="topbar"><a class="brand" href="/">▧ <span>Classroom Cards</span></a><nav aria-label="Main"><a href="/student">Card preview</a></nav></header>
<main class="login-shell"><section class="panel login-panel"><p class="eyebrow">TEACHER SPACE</p><h1>Welcome back.</h1><p>Enter the teacher PIN configured on the classroom computer.</p><form id="login-form"><label for="pin">Teacher PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" maxlength="12" required autofocus><button id="sign-in" class="button" type="submit">Open teacher space <span aria-hidden="true">↗</span></button></form><p id="page-error" class="error" role="alert"></p><p class="hint">On first startup, the app shows the PIN in the server terminal. Reset instructions are in the README.</p></section></main></body></html>
