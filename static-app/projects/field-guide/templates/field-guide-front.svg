<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.5in" viewBox="0 0 180 252" data-title="Field Guide — Front" data-template-version="5" font-family="Liberation Sans, sans-serif">
<title>Field Guide — Front</title><desc>Unlabeled student identification drawing area. Keep data-field and data-image tags when editing in Inkscape.</desc>
<rect id="background" width="180" height="252" fill="#ffffff"/>
<rect id="border" x="2.834646" y="2.834646" width="174.330708" height="246.330708" fill="none" stroke="#668256" data-color-stroke="accent" stroke-width="5.669291"/>
<text x="16" y="21" font-size="5" font-weight="bold" letter-spacing="0.15" fill="#668256" data-color-fill="accent">The Village School Field Guide</text>
<text id="common_name" data-field="common_name" data-label="Common name" data-width="148" data-lines="1" data-max-chars="38" data-line-height="12" data-required="true" x="16" y="34" font-size="10" font-weight="bold" fill="#244734" data-color-fill="text">{{common_name}}</text>
<text id="scientific_name" data-field="scientific_name" data-label="Genus and species" data-width="105" data-lines="1" data-max-chars="52" data-line-height="8" data-required="false" x="16" y="46" font-size="6.5" font-style="italic" fill="#244734" data-color-fill="text">{{scientific_name}}</text>
<text id="family" data-field="family" data-label="Family" data-after-field="scientific_name" data-prefix=" (" data-suffix=")" data-width="148" data-lines="1" data-max-chars="36" data-line-height="8" data-required="false" x="16" y="46" font-size="6.5" fill="#244734" data-color-fill="text">{{family}}</text>
<text id="category" data-field="category" data-label="Group" data-width="148" data-lines="1" data-max-chars="44" data-line-height="7" data-required="false" x="16" y="56" font-size="5.5" font-weight="bold" fill="#668256" data-color-fill="accent">{{category}}</text>
<rect id="artwork" data-image="artwork" x="5.669291" y="62" width="168.661418" height="184.330709" fill="#ffffff"/>
<g id="native-badge" data-visible-if="native" aria-label="Native organism">
<circle cx="164" cy="16" r="5.5" fill="#228b22"/>
<text id="native" data-field="native" data-input="checkbox" data-label="Native" data-checked-text="N" data-width="12" data-lines="1" data-max-chars="5" x="164" y="19" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">N</text>
</g>
</svg>
