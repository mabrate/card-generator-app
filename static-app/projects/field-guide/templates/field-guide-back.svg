<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.5in" viewBox="0 0 180 252" data-title="Field Guide — Back" data-template-version="6" font-family="Liberation Sans, sans-serif">
<title>Field Guide — Back</title><desc>Three open fields for campus observations and an unlabeled identification graphic.</desc>
<rect id="background" width="180" height="252" fill="#ffffff"/>
<rect id="border" x="2.834646" y="2.834646" width="174.330708" height="246.330708" fill="none" stroke="#668256" data-color-stroke="accent" stroke-width="5.669291"/>
<text x="16" y="15" font-size="5" font-weight="bold" letter-spacing="0.15" fill="#668256" data-color-fill="accent">The Village School Field Guide</text>
<text id="common_name" data-field="common_name" data-label="Common name" data-width="148" data-lines="1" data-max-chars="38" data-required="true" x="16" y="27" font-size="9" font-weight="bold" fill="#244734" data-color-fill="text">{{common_name}}</text>
<text x="16" y="39" font-size="5" font-weight="bold" fill="#668256" data-color-fill="accent">ADULT SIZE</text>
<text id="size" data-field="size" data-label="Adult size" data-width="148" data-lines="1" data-max-chars="70" data-line-height="7.5" x="16" y="48" font-size="5.8" fill="#244734" data-color-fill="text">{{size}}</text>
<text x="16" y="60" font-size="5" font-weight="bold" fill="#668256" data-color-fill="accent">IDENTIFICATION CLUES</text>
<text id="identification_clues" data-field="identification_clues" data-label="Identification clues" data-width="148" data-lines="4" data-max-chars="210" data-line-height="7.5" x="16" y="69" font-size="5.8" fill="#244734" data-color-fill="text">{{identification_clues}}</text>
<text x="16" y="108" font-size="5" font-weight="bold" fill="#668256" data-color-fill="accent">ADAPTATIONS &amp; ECOLOGY</text>
<text id="adaptations_ecology" data-field="adaptations_ecology" data-label="Adaptations &amp; Ecology" data-width="148" data-lines="4" data-max-chars="230" data-line-height="7.5" x="16" y="117" font-size="5.8" fill="#244734" data-color-fill="text">{{adaptations_ecology}}</text>
<rect id="artwork" data-image="artwork" x="5.669291" y="150" width="168.661418" height="96.330709" fill="#ffffff"/>
<g id="native-badge" data-visible-if="native" aria-label="Native organism">
<circle cx="164" cy="16" r="5.5" fill="#228b22"/>
<text id="native" data-field="native" data-input="checkbox" data-label="Native" data-checked-text="N" data-width="12" data-lines="1" data-max-chars="5" x="164" y="19" text-anchor="middle" font-size="8" font-weight="bold" fill="#ffffff">N</text>
</g>
</svg>
